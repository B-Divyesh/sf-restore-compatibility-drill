[package]
name = "restore-drill"
version = "0.1.0"
edition = "2024"
description = "Prove a Postgres backup restores into the version you intend to run"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-restore-compatibility-drill"
include = [
  "/src/**",
  "/examples/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[[bin]]
name = "restore-drill"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
